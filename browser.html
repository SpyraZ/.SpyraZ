<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpyraZ Secure Browser</title>
    <style>
        /* CSS Reset & Variable Definitions */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-primary: #0a0a0c;
            --bg-surface: #141417;
            --bg-input: #1c1c21;
            --accent-color: #00ffaa;
            --text-main: #ffffff;
            --text-muted: #8a8a93;
            --border-color: #2c2c35;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .browser-container {
            width: 100%;
            max-width: 550px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        /* Logo and Header Styles */
        .header-section {
            margin-bottom: 35px;
        }

        .shield-icon {
            font-size: 70px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(0, 255, 170, 0.2));
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.2);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Search & URL Input Bar */
        .search-form {
            width: 100%;
            margin-bottom: 30px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px 8px 4px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: all 0.25s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 255, 170, 0.15), 0 8px 24px rgba(0,0,0,0.3);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 16px;
            padding: 12px 0;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper button {
            background: var(--accent-color);
            border: none;
            outline: none;
            color: #000000;
            font-weight: 700;
            font-size: 15px;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .input-wrapper button:active {
            transform: scale(0.97);
        }

        /* Quick Shortcuts Grid */
        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .shortcut-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 10px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .shortcut-card:hover {
            border-color: #444450;
            background: #1a1a20;
            transform: translateY(-2px);
        }

        .shortcut-icon {
            font-size: 24px;
        }

        /* Privacy Disclaimer Footer */
        .info-footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Smooth Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="browser-container">
        <div class="header-section">
            <div class="shield-icon">🛡️</div>
            <h1>SpyraZ Browser</h1>
            <div class="status-badge">
                <div class="status-dot"></div> Incognito Framework Active
            </div>
        </div>

        <form class="search-form" onsubmit="navigateBrowser(event)">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="searchBar" 
                    placeholder="Search query or enter web URL..." 
                    autocomplete="off" 
                    autocorrect="off" 
                    autocapitalize="off" 
                    spellcheck="false"
                    autofocus
                >
                <button type="submit">Launch</button>
            </div>
        </form>

        <div class="shortcut-grid">
            <a href="https://www.youtube.com" class="shortcut-card">
                <span class="shortcut-icon">📺</span>
                <span>YouTube</span>
            </a>
            <a href="https://www.google.com" class="shortcut-card">
                <span class="shortcut-icon">🔍</span>
                <span>Google</span>
            </a>
            <a href="https://github.com" class="shortcut-card">
                <span class="shortcut-icon">💻</span>
                <span>GitHub</span>
            </a>
            <a href="https://www.wikipedia.org" class="shortcut-card">
                <span class="shortcut-icon">📚</span>
                <span>Wikipedia</span>
            </a>
        </div>

        <div class="info-footer">
            Isolated Sandbox Environment. All temporary cookies, local caches, and form tracks are systematically restricted from main browser profiles.
        </div>
    </div>

    <script>
        function navigateBrowser(event) {
            event.preventDefault();
            let rawInput = document.getElementById('searchBar').value.trim();
            
            if (!rawInput) return;

            // Regex expression evaluation to check if input matches a clear web domain string
            const urlRegexPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
            
            if (urlRegexPattern.test(rawInput)) {
                // If the user forgot to append http:// or https://, add it automatically
                if (!/^https?:\/\//i.test(rawInput)) {
                    rawInput = 'https://' + rawInput;
                }
                window.location.href = rawInput;
            } else {
                // If it is regular text, route the text as a query parameter via DuckDuckGo
                window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(rawInput);
            }
        }
    </script>

</body>
</html>
